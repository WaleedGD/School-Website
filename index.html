<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العلوم – الصف الرابع | مقرر تفاعلي (متحرك)</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8f7;--card:#fff;--ink:#17302c;--mut:#5f7470;--line:#e0e9e6;--acc:#0f766e;--soft:#e4f3f0;--ok:#1e9a52;--bad:#d24545;--sh:0 4px 16px rgba(15,60,55,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b19;--card:#17262a;--ink:#e6f1ee;--mut:#9bb3ae;--line:#26393c;--acc:#4fc3b5;--soft:#1b3433;--sh:none}}
:root[data-theme="dark"]{--bg:#0f1b19;--card:#17262a;--ink:#e6f1ee;--mut:#9bb3ae;--line:#26393c;--acc:#4fc3b5;--soft:#1b3433;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.9 Tajawal,Tahoma,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
button{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.top b{flex:1;font-size:17px}
.ib{border:1px solid var(--line);background:var(--bg);border-radius:12px;width:40px;height:40px;cursor:pointer}
#mb{display:none}
.pill{background:var(--soft);color:var(--acc);border-radius:20px;padding:2px 12px;font-size:14px;white-space:nowrap}
.tb{position:absolute;inset:auto 0 0 0;height:3px}.tb i{display:block;height:100%;background:var(--acc);transition:width .4s}
.layout{display:flex;max-width:1100px;margin:auto}
.side{width:290px;flex:none;position:sticky;top:60px;align-self:flex-start;max-height:calc(100vh - 64px);overflow:auto;padding:14px}
.side a{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-size:16px;line-height:1.6;cursor:pointer}
.side a:hover{background:var(--soft)}.side a.on{background:var(--acc);color:#fff}
.side .u{font-weight:800;margin-top:10px}.side .c{color:var(--mut);font-size:14px;padding-right:20px}.side .l{padding-right:30px;font-size:15px}
.side small{margin-right:auto;opacity:.8}
.ur{display:flex;align-items:center;margin-top:10px}.ur .u{flex:1;margin-top:0}
.ar{border:0;background:none;cursor:pointer;width:36px;height:36px;border-radius:10px;color:var(--mut);font-size:18px;transition:transform .2s}.ar.op{transform:rotate(180deg)}.ar:hover{background:var(--soft)}
.view{flex:1;min-width:0;padding:18px 18px 60px}
.w .top,.w .side{display:none}
h1{margin:6px 0 10px;font-size:26px;font-weight:800}
.hero{text-align:center;padding:12vh 6px 24px;background:radial-gradient(circle at 50% 0,var(--soft),transparent 65%)}
.hero h1{font-size:clamp(28px,7vw,40px);line-height:1.4}
.logo{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:46px;box-shadow:var(--sh)}
.lead{color:var(--mut);font-size:19px;margin:10px 0 26px}
.cta{font-size:20px;padding:13px 34px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:30px}
.chips span{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:5px 16px;font-size:15px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2,.card h3{margin:0 0 8px;color:var(--acc);font-size:20px}.card li{margin:8px 0}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:right;margin:10px 0;padding:14px 16px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);cursor:pointer;box-shadow:var(--sh);font-size:19px;font-weight:700}
.row:hover{border-color:var(--acc)}
.uic{width:50px;height:50px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:26px;flex:none}
.ut{flex:1}.ut small{display:block;color:var(--mut);font-weight:400;font-size:14px}
.mini{display:block;height:6px;background:var(--line);border-radius:6px;margin-top:4px;overflow:hidden}.mini i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:10px 0 16px;padding-bottom:4px}
.tab{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:30px;padding:6px 16px;font-size:16px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.go{border:0;border-radius:30px;padding:9px 22px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
.go.s{background:var(--soft);color:var(--acc)}
.term{padding:10px 0;border-bottom:1px dashed var(--line)}.term:last-child{border:0}.term b{color:var(--acc)}.term b::after{content:" : "}
.mp{display:flex;flex-direction:column;align-items:center;overflow-x:auto}
.mr{background:var(--acc);color:#fff;border-radius:16px;padding:8px 20px;font-weight:800}
.mc{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;border-top:2px solid var(--line);margin-top:16px;padding-top:16px}
.mb{display:flex;flex-direction:column;align-items:center;gap:6px}
.mn{background:var(--soft);border:1.5px solid var(--acc);border-radius:14px;padding:4px 14px;font-weight:700}
.mk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:15px;color:var(--mut)}
.fc{min-height:190px;display:grid;place-items:center;text-align:center;padding:24px;border-radius:22px;border:2px solid var(--acc);background:var(--card);cursor:pointer;font-size:24px;font-weight:800;box-shadow:var(--sh)}
.fc.b{background:var(--soft);font-size:20px;font-weight:500}
.fcn{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--mut)}
.q{margin:18px 0 4px;font-weight:700}
.opt{display:block;width:100%;text-align:right;margin:8px 0;padding:11px 15px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.why{font-size:15px;color:var(--mut);margin:2px 4px 8px}
.win{text-align:center;font-size:20px;font-weight:800}
.pg{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes slN{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slP{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.view{transition:opacity .17s,transform .17s}.view.out{opacity:0;transform:translateY(-8px)}
.in>*{animation:rise .4s both}.in>*:nth-child(2){animation-delay:.05s}.in>*:nth-child(3){animation-delay:.1s}.in>*:nth-child(4){animation-delay:.15s}.in>*:nth-child(5){animation-delay:.2s}.in>*:nth-child(6){animation-delay:.25s}
.hero>*{animation:rise .6s both}.hero>*:nth-child(2){animation-delay:.1s}.hero>*:nth-child(3){animation-delay:.2s}.hero>*:nth-child(4){animation-delay:.3s}.hero>*:nth-child(5){animation-delay:.4s}
.hero .logo{animation:rise .6s both,bob 3.5s ease-in-out .6s infinite}
.chips span{animation:pop .5s both}.chips span:nth-child(2){animation-delay:.1s}.chips span:nth-child(3){animation-delay:.2s}.chips span:nth-child(4){animation-delay:.3s}.chips span:nth-child(5){animation-delay:.4s}
.sub{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s ease,visibility 0s .3s}.sub.op{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .3s ease,visibility 0s}.sub>div{overflow:hidden}
.opt.ok.pop{animation:pop .35s}.opt.bad.pop{animation:shake .4s}.why.sl{animation:rise .3s both}
.win{animation:pop .45s}
.go,.opt,.row,.tab{transition:transform .15s,background .2s,border-color .2s}.go:active,.opt:active,.tab:active{transform:scale(.96)}
.fcw{perspective:900px}.fcw.nx{animation:slN .35s both}.fcw.pv{animation:slP .35s both}
.fci{position:relative;height:230px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1)}.fci.f{transform:rotateY(180deg)}
.fci .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto}
.fci .bk{transform:rotateY(180deg);background:var(--soft);font-size:20px;font-weight:500}
@media(max-width:820px){#mb{display:block}.side{display:none;position:fixed;top:60px;right:0;bottom:0;width:min(310px,86vw);max-height:none;background:var(--card);z-index:8;border-left:1px solid var(--line)}.side.open{display:block}}

:root{--hot:#ff8a3d;--sun:#ffc533}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(720deg)}}
.in>*{animation:rise .6s cubic-bezier(.2,.9,.3,1.25) both}.in>*:nth-child(2){animation-delay:.07s}.in>*:nth-child(3){animation-delay:.14s}.in>*:nth-child(4){animation-delay:.21s}.in>*:nth-child(5){animation-delay:.28s}.in>*:nth-child(6){animation-delay:.35s}
body{background:radial-gradient(900px 420px at 85% -60px,color-mix(in srgb,var(--acc) 15%,transparent),transparent),radial-gradient(700px 420px at 0 140px,color-mix(in srgb,var(--hot) 11%,transparent),transparent),var(--bg)}
body::before{background:#0b6b64}
.top{background:linear-gradient(90deg,#0b6b64,#0e9aa7);color:#fff;border:0;box-shadow:0 4px 18px rgba(8,80,75,.25)}
.top b{color:#fff;font-size:19px}
.ib{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:14px}.ib:hover{background:rgba(255,255,255,.32)}
.pill{background:#fff;color:#0b6b64;font-weight:800;font-size:15px;padding:3px 14px}.pill.bump{animation:pop .5s}
.tb{background:rgba(255,255,255,.25)}.tb i{background:var(--sun)}
.side a.on{background:linear-gradient(90deg,var(--acc),#0e9aa7);box-shadow:0 4px 12px rgba(15,118,110,.3)}
h1{font-size:30px;background:linear-gradient(90deg,var(--acc),#2a7de1);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{border:0;border-top:5px solid var(--acc);border-radius:26px;padding:22px}.card h2,.card h3{font-size:22px}
.hero{position:relative;overflow:hidden;border-radius:32px;margin-top:10px;padding:10vh 12px 38px;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 24%,var(--card)),var(--card) 62%)}
.hero .logo{width:112px;height:112px;font-size:58px;background:linear-gradient(135deg,#fff,var(--soft));border:4px solid var(--acc)}
.fl{position:absolute;font-size:34px}.f1{top:6%;right:8%}.f2{top:14%;left:9%}.f3{top:48%;right:4%}.f4{top:56%;left:5%}.f5{bottom:8%;right:20%}.f6{bottom:10%;left:22%}
.hero>.fl{animation:bob 4s ease-in-out infinite}.hero>.f2{animation-delay:.6s}.hero>.f3{animation-delay:1.2s}.hero>.f4{animation-delay:1.8s}.hero>.f5{animation-delay:.3s}
.hero>.cta{animation:rise .6s .3s both,pulse 2s 1s infinite}
.go{background:linear-gradient(180deg,#14a39a,var(--acc));box-shadow:0 4px 0 #0a524c}.go:active{transform:translateY(3px);box-shadow:0 1px 0 #0a524c}
.go.s{background:var(--soft);color:var(--acc);box-shadow:0 3px 0 var(--line)}
.cta{background:linear-gradient(180deg,#ffa05c,var(--hot));box-shadow:0 5px 0 #c4561a;font-size:22px;padding:14px 42px}.cta:active{box-shadow:0 1px 0 #c4561a}
.row{padding:16px 18px;border:2px solid var(--line);border-radius:24px}
.row:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 12px 26px rgba(15,100,95,.18)}
.uic{width:64px;height:64px;border-radius:20px;font-size:33px}
.view>.row:nth-of-type(1) .uic{background:color-mix(in srgb,#34d399 32%,var(--card))}
.view>.row:nth-of-type(2) .uic{background:color-mix(in srgb,#60a5fa 32%,var(--card))}
.view>.row:nth-of-type(3) .uic{background:color-mix(in srgb,#a78bfa 32%,var(--card))}
.mini{height:9px}.mini i{background:linear-gradient(90deg,var(--acc),var(--sun))}
.tab{padding:8px 18px;font-size:17px;font-weight:700}.tab.on{background:linear-gradient(180deg,#14a39a,var(--acc));box-shadow:0 3px 0 #0a524c}
.q{font-size:19px;counter-reset:o}
.opt{counter-increment:o;display:flex;align-items:center;gap:12px;border-width:2px;padding:12px 14px;border-radius:18px;font-size:18px}
.opt:not(:disabled):hover{border-color:var(--acc);background:var(--soft);transform:translateX(-5px)}
.opt::before{content:counter(o,arabic-indic);flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--acc);font-weight:800}
.opt.ok::before{content:"✓";background:var(--ok);color:#fff}.opt.bad::before{content:"✕";background:var(--bad);color:#fff}
.fci .fc{background:linear-gradient(135deg,var(--acc),#2a7de1);color:#fff;border:0;font-size:30px;border-radius:30px;box-shadow:0 12px 28px rgba(15,100,95,.3)}
.fci .bk{background:linear-gradient(135deg,#fff1cf,#ffd9a8);color:#4a2f00;font-size:21px}
.win{background:linear-gradient(135deg,#fff6d6,#ffe1b8);color:#5a3a00;border-top-color:var(--hot)}
.top b{line-height:1.35}.by2{display:block;font-size:12px;font-weight:500;opacity:.85;line-height:1.3}
.hero>.by{position:absolute;top:14px;left:0;right:0;width:max-content;max-width:90%;margin:auto;padding:2px 16px;font-size:15px;font-weight:700;color:var(--acc);background:var(--card);border:1px solid var(--line);border-radius:30px;animation:rise .6s .5s both}
.cr{text-align:center;padding:18px 16px calc(26px + env(safe-area-inset-bottom,0px));font-size:14px;color:var(--ink);opacity:.45;letter-spacing:.2px;user-select:none}
.cf{position:fixed;top:-14px;width:10px;height:15px;border-radius:3px;z-index:99;pointer-events:none;animation:fall 1.9s ease-in forwards}
@media(prefers-reduced-motion:reduce){.in>*,.hero>*,.fcw.nx,.fcw.pv,.win,.why.sl{animation:fade .4s both!important}.hero>.fl,.hero .logo,.hero>.cta,.cf,.chips span,.opt.bad.pop,.opt.ok.pop{animation:none!important}}
</style></head><body>

<script>
const U=[
{t:"الوحدة الأولى: المخلوقات الحية",e:"🌿",c:"#0f766e",ch:[
 {t:"الفصل الأول: ممالك المخلوقات الحية",l:[
  {t:"الدرس الأول: الخلايا",p:["الخلية هي أصغر وحدة بناء في كل مخلوق حي.","نستخدم المجهر لنرى الخلايا لأنها صغيرة جداً، والملاحظة الجيدة تعتمد على الحواس والأدوات.","للخلية النباتية جدار خلوي وبلاستيدات خضراء، أما الحيوانية فليس لها جدار خلوي."],
   q:[["ما أصغر وحدة بناء في المخلوق الحي؟",["الجهاز","الخلية","العضو"],1,"كل المخلوقات الحية مبنية من خلايا."],["أي جزء نجده في الخلية النباتية فقط؟",["النواة","الغشاء الخلوي","الجدار الخلوي"],2,"الجدار الخلوي يعطي النبات شكلاً ثابتاً."]]},
  {t:"الدرس الثاني: تصنيف المخلوقات الحية",p:["التصنيف هو جمع المخلوقات في مجموعات حسب صفاتها المشتركة.","من الممالك: الحيوانات والنباتات والفطريات.","النباتات تصنع غذاءها بنفسها، والحيوانات تحصل عليه من مخلوقات أخرى."],

  x:[["أي مما يلي من الفطريات؟",["عيش الغراب","الصبّار","النحلة"],0,"عيش الغراب (الفطر) من مملكة الفطريات."]]},
 {t:"الفصل الثاني: المملكة الحيوانية",l:[
  {t:"الدرس الأول: الحيوانات اللافقارية",p:["الحيوانات اللافقارية ليس لها عمود فقري.","منها الحشرات والديدان وقنديل البحر.","بعضها له هيكل خارجي صلب يحميه."],
   q:[["أي مما يلي حيوان لافقاري؟",["الفراشة","السمكة","القطة"],0,"الفراشة حشرة بلا عمود فقري."],["أي حيوان ليس له عمود فقري؟",["الدودة","الحصان","الصقر"],0,"الديدان من اللافقاريات."]]},
  {t:"الدرس الثاني: الحيوانات الفقارية",p:["الحيوانات الفقارية لها عمود فقري.","مجموعاتها خمس: الثدييات والطيور والأسماك والزواحف والبرمائيات.","الثدييات ترضع صغارها، والطيور لها ريش وتبيض."],
   q:[["أي حيوان يعيش في الماء وعلى اليابسة؟",["الأسد","الضفدع","الصقر"],1,"الضفدع من البرمائيات."],["ما الصفة التي تميّز الطيور؟",["الشعر","الزعانف","الريش"],2,"الريش يساعد على الطيران والدفء."]]},
  {t:"الدرس الثالث: أجهزة أجسام الحيوانات",p:["لكل جهاز في الجسم وظيفة، مثل الهضم والتنفس والدوران.","جهاز الهضم يحوّل الطعام إلى مواد يستفيد منها الجسم.","الأسماك تتنفس بالخياشيم، والقلب يضخ الدم في الجسم."],
   q:[["بماذا تتنفس الأسماك؟",["الرئتين","الخياشيم","الجلد فقط"],1,"الخياشيم تأخذ الأكسجين من الماء."],["ما وظيفة جهاز الهضم؟",["تحويل الطعام إلى مواد مفيدة","ضخ الدم","الإحساس بالألم"],0,"الهضم يفتّت الطعام ليستفيد الجسم منه."]]}],
  x:[["أي حيوان من الثدييات؟",["القرش","الدلفين","السلحفاة"],1,"الدلفين يتنفس الهواء ويرضع صغاره."]]}]},
{t:"الوحدة الثانية: الأنظمة البيئية",e:"🌳",c:"#0f766e",ch:[
